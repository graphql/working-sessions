name: Validate calendar

on:
  pull_request:
    paths:
      - 'calendar/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: calendar/scripts
      - run: node calendar/scripts/sync.mjs --validate
